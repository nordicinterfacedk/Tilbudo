 class="mi" data-o onclick="mm();go('firma')"><i data-i="firm"></i>Mit firma</button><button class="mi out" onclick="if(sb)sb.auth.signOut().then(function(){location.reload()})"><i data-i="out"></i>Log ud</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var DEMO=false; /* false = fælles Supabase-database (kør schema.sql først). true = kun lokal test i browseren */
var SB_URL="DIN_SUPABASE_URL",SB_KEY="DIN_ANON_KEY";
var S,tab='dash',D=null;
var def={firma:{navn:'',cvr:'',adr:'',tlf:'',mail:'',bet:'Tilbuddet er gyldigt i 30 dage. Betaling 8 dage netto. Priser er ekskl. moms medmindre andet er angivet.'},
ydel:[{n:'Timeløn, svend',e:'time',p:495},{n:'Opstart og kørsel',e:'stk',p:350},{n:'Materialer (efter forbrug)',e:'stk',p:0}],docs:[],nr:1001};
var sb=null;try{if(!DEMO)sb=supabase.createClient(SB_URL,SB_KEY)}catch(e){}var U=null,tm,$=function(i){return document.getElementById(i)};
var V=0,V2=0,fl=0,again=0,B={},LU='[]',ROLE='',TM=[],CL=['docs','kunder','udg','todo','ev','leads'],C1=['docs','kunder','todo','ev','leads'],RESTR=['okon','udg','ydel','firma'];
function own(){return DEMO||ROLE=='owner'}
function snap(){CL.forEach(function(c){B[c]=((S&&S[c])||[]).map(function(x){return x.id})})}
function mrg(Rm,cols){cols.forEach(function(c){var L=S[c]||[],have={},old={};L.forEach(function(x){have[x.id]=1});(B[c]||[]).forEach(function(i){old[i]=1});(Rm[c]||[]).forEach(function(x){if(!have[x.id]&&!old[x.id])L.push(x)});S[c]=L})}
function put(id,d,v){return sb.from('workspace').update({data:d,version:v+1,updated_at:new Date().toISOString(),updated_by:U.email}).eq('id',id).eq('version',v).select('version')}
async function flush(){clearTimeout(tm);tm=0;if(DEMO){try{localStorage.setItem('tf',JSON.stringify(S))}catch(e){toast('Kunne ikke gemme: browserens lager er fuldt.')}return}
 if(!U||!sb||!ROLE)return;if(fl){again=1;return}fl=1;
 try{for(var t=0;t<4;t++){var d=Object.assign({},S);delete d.udg;var r=await put(1,d,V);
   if(r.error){toast('Kunne ikke gemme: '+r.error.message);break}
   if(r.data&&r.data.length){V=r.data[0].version;snap();break}
   var x=await sb.from('workspace').select('data,version').eq('id',1).single();if(x.error){toast('Kunne ikke hente: '+x.error.message);break}
   mrg(x.data.data,C1);V=x.data.version}
  if(own()){for(var t2=0;t2<4;t2++){var u=JSON.stringify(S.udg||[]);if(u==LU)break;var r2=await put(2,{udg:S.udg||[]},V2);
   if(r2.error){toast('Kunne ikke gemme udgifter: '+r2.error.message);break}
   if(r2.data&&r2.data.length){V2=r2.data[0].version;LU=u;snap();break}
   var y=await sb.from('workspace').select('data,version').eq('id',2).single();if(y.error)break;
   mrg(y.data.data,['udg']);V2=y.data.version}}
 }catch(e){toast('Kunne ikke gemme: '+(e.message||e))}
 fl=0;if(again){again=0;flush()}}
function apply(n){if(!n||fl||tm||D)return;var ch=0;
 if(n.id==1&&n.version>V){var u=S.udg;S=n.data;if(u)S.udg=u;V=n.version;ch=1}
 else if(n.id==2&&n.version>V2&&own()){S.udg=n.data.udg||[];V2=n.version;LU=JSON.stringify(S.udg);ch=1}
 if(!ch)return;snap();var a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render()}
function live(){if(DEMO||!sb)return;try{sb.channel('ws').on('postgres_changes',{event:'UPDATE',schema:'public',table:'workspace'},function(p){apply(p.new)}).subscribe()}catch(e){}
 setInterval(async function(){if(document.hidden||fl||tm||D)return;var x=await sb.from('workspace').select('id,data,version').in('id',[1,2]);(x.data||[]).forEach(apply)},15000)}
async function loadTeam(){if(!own()||DEMO)return;var r=await sb.from('members').select('email,role').order('email');TM=r.data||[]}
async function addM(){var e=$('me').value.trim().toLowerCase();if(e.indexOf('@')<1){toast('Skriv en gyldig e-mail');return}var r=await sb.from('members').insert({email:e,role:$('mr').value});if(r.error){toast(r.error.message);return}await loadTeam();render();toast('Medarbejder tilføjet')}
async function setM(i,role){var m=TM[i];if(m.role=='owner'&&role!='owner'&&TM.filter(function(x){return x.role=='owner'}).length<2){toast('Der skal være mindst én ejer');render();return}var r=await sb.from('members').update({role:role}).eq('email',m.email);if(r.error)toast(r.error.message);await loadTeam();render()}
async function delM(i){var m=TM[i];if(m.email==U.email.toLowerCase()){toast('Du kan ikke fjerne dig selv');return}if(!confirm('Fjern adgang for '+m.email+'?'))return;await sb.from('members').delete().eq('email',m.email);await loadTeam();render()}
function teamCard(){if(DEMO||!own())return '';return '<div class="card"><h4>Team og roller</h4><p class="mut">Ejere ser og redigerer alt. Medarbejdere kan arbejde med tilbud, fakturaer, kunder, leads og kalender, men ikke se udgifter og økonomi, ændre firmaindstillinger eller slette kunder og dokumenter. Personen opretter selv en konto med den e-mail, du tilføjer.</p><table class="tbl"><tbody>'+TM.map(function(m,i){return '<tr><td>'+esc(m.email)+'</td><td><select onchange="setM('+i+',this.value)"><option value="owner"'+(m.role=='owner'?' selected':'')+'>Ejer</option><option value="staff"'+(m.role=='staff'?' selected':'')+'>Medarbejder</option></select></td><td class="r"><button class="ib d" title="Fjern" onclick="delM('+i+')">'+ic('trash')+'</button></td></tr>'}).join('')+'</tbody></table><div class="row" style="margin-top:12px;justify-content:flex-start"><input id="me" type="email" placeholder="e-mail@firma.dk" style="max-width:260px"><select id="mr" style="width:150px"><option value="staff">Medarbejder</option><option value="owner">Ejer</option></select><button class="p" onclick="addM()">'+ic('plus')+'Tilføj</button></div></div>'}

function sv(){clearTimeout(tm);tm=setTimeout(flush,DEMO?250:600)}
window.addEventListener('beforeunload',function(){if(tm)flush()});document.addEventListener('visibilitychange',function(){if(document.hidden&&tm)flush()});
async function boot(){try{await boot0()}catch(e){$('hd').style.display='none';$('top').style.display='none';$('v').innerHTML='<div class="empty"><h3>Kunne ikke starte appen</h3><p class="mut">'+esc(e.message||e)+'<br>Tjek Supabase-URL og nøgle øverst i filen, eller sæt DEMO=true.</p></div>'}}
async function boot0(){if(!DEMO&&!sb)throw new Error('Supabase er ikke sat op (URL/nøgle mangler eller er ugyldig).');
 if(DEMO){try{S=JSON.parse(localStorage.getItem('tf')||'null')}catch(e){}if(!S||!Array.isArray(S.docs)||!S.firma||!Array.isArray(S.ydel))S=JSON.parse(JSON.stringify(def));return render()}
 var q=new URLSearchParams(location.search).get('t');if(q)return pub(q);
 sb.auth.onAuthStateChange(function(ev){if(ev=='PASSWORD_RECOVERY'){var p=prompt('Vælg ny adgangskode (mindst 8 tegn):');if(p&&p.length>=8)sb.auth.updateUser({password:p}).then(function(r){toast(r.error?r.error.message:'Adgangskode opdateret')})}});
 var r=await sb.auth.getSession();U=r.data.session&&r.data.session.user;if(!U)return loginView();
 var m=await sb.from('members').select('role').eq('email',U.email.toLowerCase()).maybeSingle();if(m.error)throw m.error;if(!m.data)return noAccess();ROLE=m.data.role;
 var x=await sb.from('workspace').select('id,data,version').in('id',[1,2]);if(x.error)throw x.error;
 var r1=x.data.filter(function(z){return z.id==1})[0],r2=x.data.filter(function(z){return z.id==2})[0];
 if(r1){S=r1.data||JSON.parse(JSON.stringify(def));V=r1.version}
 else{if(!own())throw new Error('Der er ingen data endnu. Bed ejeren om at logge ind først.');var old=null;try{old=JSON.parse(localStorage.getItem('tf')||'null')}catch(e){}S=(old&&Array.isArray(old.docs)&&old.firma)?old:JSON.parse(JSON.stringify(def));
  var d0=Object.assign({},S);delete d0.udg;var w=await sb.from('workspace').insert({id:1,data:d0,version:1,updated_by:U.email});if(w.error)throw w.error;V=1}
 if(own()){if(r2){S.udg=r2.data.udg||[];V2=r2.version}else{var lg=S.udg||[];var w2=await sb.from('workspace').insert({id:2,data:{udg:lg},version:1,updated_by:U.email});if(w2.error)throw w2.error;S.udg=lg;V2=1}
  LU=JSON.stringify(S.udg||[]);if(r1&&r1.data&&r1.data.udg)sv()}else delete S.udg;
